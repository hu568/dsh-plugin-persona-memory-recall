# dsh-persona-memory-recall bundle 层：把召回插件行插进**宿主组合**。
#
# 为什么是宿主平面而不是 agent 预设：召回要向所有预设的每个会话生效，
# 且它消费的 agent/pre-step 事件由宿主的 agent-loop 派发。
#
# 与 @dsh-external/dsh-persona-memory 是独立的两行：
#   persona-memory         → 角色/全局/项目记忆（系统提示词段落，首条消息冻结）
#   persona-memory-recall  → 长期日志按轮召回（本轮用户消息之前的一条 user 快照）
# 两者只通过磁盘上的 $DSH_HOME/memory/JOURNAL.jsonl 约定耦合，可以单独停用。
#
# 语义召回（0.6.0）默认开，但没有 API Key 时自动退回纯 BM25；这里不写任何 key。
# 可用配置键（都走 schemastery 默认值，按需在组合里覆盖）：
#   semantic: true|false              总开关
#   semanticModel: 'BAAI/bge-m3'      嵌入模型
#   semanticBaseURL: 'https://api.siliconflow.cn/v1'
#   semanticApiKey: ''                空 = 读 $DSH_HOME/memory/recall-rag.json → env SILICONFLOW_API_KEY
#   semanticMinSimilarity: 0.55       相似度门槛
#   semanticTimeoutMs: 4000           单轮语义查询超时（超时降级纯 BM25）
#   semanticMinQueryChars: 4          查询太短不 embed
#   semanticCachePath: ''             空 = $DSH_HOME/memory/recall/embeddings.json
#   semanticWarmupBatch: 64           每轮后台最多补多少条向量
- insert:
    - id: persona-memory-recall
      name: '@dsh-external/dsh-persona-memory-recall'
      config: {}
